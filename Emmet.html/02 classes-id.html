<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes and IDs</title>
</head>
<body>
    <p class="introduction">This is a paragraph with a class.</p>
    <div id="container">This is a div with an ID.</div>
    <div class="card featured">This div has two classes.</div>
    <section id="about" class="content-section">This section has an ID and a class.</section>

    <header class="site-header">This is the header.</header>
    <nav id="main-nav">This is the navigation.</nav>
    <main class="content">This is the main content.</main>
    <section id="about">This is the about section.</section>
    <footer class="site-footer">This is the footer.</footer>
</body>
</html>
